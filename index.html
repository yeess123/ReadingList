<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="독서생활" />
  <title>스마트 독서 리스트 앱</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 40px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 카드 공통 스타일 */
    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-count {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 10px;
      border-radius: 20px;
    }

    /* 상단 그래프 영역 */
    .chart-box {
      width: 100%;
      height: 170px;
      position: relative;
    }

    /* 검색 & 등록 섹션 */
    .search-wrapper {
      position: relative;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    /* 검색 및 직접 등록 버튼 */
    .btn-search {
      padding: 10px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.2s;
    }

    .btn-search:active {
      background: var(--primary-hover);
    }

    .btn-direct-add {
      padding: 10px 10px;
      background: #f8fafc;
      color: var(--text-sub);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .btn-direct-add:active, .btn-direct-add:hover {
      background: #e2e8f0;
      color: var(--text-main);
    }

    /* 검색 자동완성 드롭다운 */
    .search-dropdown {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: none;
    }

    .search-section-label {
      padding: 6px 12px;
      background-color: #f8fafc;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }

    .search-item {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.15s;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover, .search-item:active {
      background-color: #f8fafc;
    }

    .search-thumb {
      width: 34px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #e2e8f0;
      flex-shrink: 0;
    }

    .search-info {
      flex: 1;
      min-width: 0;
    }

    .search-info-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-info-sub {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-empty-box {
      padding: 16px 12px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .search-empty-msg {
      font-size: 0.85rem;
      color: var(--text-sub);
      line-height: 1.4;
    }

    .btn-manual-from-search {
      padding: 7px 14px;
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid var(--primary);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* 테이블 영역 */
    .table-container {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      table-layout: fixed;
    }

    th {
      background-color: #f8fafc;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 9px 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      font-size: 0.82rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .col-num { 
      width: 28px; 
      text-align: center; 
      color: #94a3b8; 
      font-size: 0.76rem;
      padding-left: 4px;
      padding-right: 4px;
    }
    .col-title { 
      width: 38%; 
      font-weight: 600; 
      color: var(--text-main); 
      cursor: pointer; 
    }
    .col-note { 
      width: auto;
      color: var(--text-sub); 
      font-size: 0.8rem; 
      text-align: left; 
    }

    .book-title-cell {
      cursor: pointer;
      display: block;
      color: var(--text-main);
      font-weight: 600;
      word-break: break-word;
      line-height: 1.35;
      font-size: 0.82rem;
    }

    .book-title-cell:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .note-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      color: #475569;
      font-size: 0.8rem;
    }

    .empty-state {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* 모달 팝업 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s ease-in-out;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-row-author-page {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .form-row-author-page .group-author {
      flex: 1;
      min-width: 0;
    }

    .form-row-author-page .group-page {
      width: 82px;
      flex-shrink: 0;
    }

    .page-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .page-input-box input {
      width: 100%;
      padding: 9px 24px 9px 8px !important;
      font-size: 0.84rem !important;
      text-align: right;
    }

    .page-unit {
      position: absolute;
      right: 7px;
      font-size: 0.78rem;
      color: var(--text-sub);
      pointer-events: none;
    }

    .form-group input, .form-group textarea {
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      color: var(--text-main);
    }

    .form-group input:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
    }

    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .btn-delete { background: #fee2e2; color: #dc2626; margin-right: auto; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상단: 통계 및 차트 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📖 독서 생활</div>
        <div class="badge-count" id="totalBadge">총 누적 0권</div>
      </div>
      <div class="chart-box">
        <canvas id="readingChart"></canvas>
      </div>
    </div>

    <!-- 검색 & 등록 -->
    <div class="card">
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="책 제목 입력 (예: 불안 세대)" onkeypress="if(event.key==='Enter') executeSearch();" />
        <button class="btn-search" onclick="executeSearch()">검색</button>
        <button class="btn-direct-add" onclick="openManualAddModal()">+ 직접입력</button>
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>

    <!-- 하단: 도서 리스트 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">독서 기록 목록</div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-num"></th>
              <th class="col-title">제목</th>
              <th class="col-note">비고</th>
            </tr>
          </thead>
          <tbody id="bookTableBody">
            <!-- 동적 로드 -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 상세 정보 및 수정/직접입력 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <div class="modal-title" id="modalHeaderTitle">도서 상세 및 수정</div>
      <input type="hidden" id="modalBookId" />

      <!-- 1. 책 제목 -->
      <div class="form-group">
        <label>책 제목 *</label>
        <input type="text" id="modalTitle" placeholder="책 제목을 입력하세요" />
      </div>

      <!-- 2. 저자 & 페이지 수 -->
      <div class="form-row-author-page">
        <div class="form-group group-author">
          <label>저자</label>
          <input type="text" id="modalAuthor" placeholder="저자 이름" />
        </div>
        <div class="form-group group-page">
          <label>페이지</label>
          <div class="page-input-box">
            <input type="number" id="modalPage" placeholder="350" />
            <span class="page-unit">p</span>
          </div>
        </div>
      </div>

      <!-- 3. 완독일 -->
      <div class="form-group">
        <label>완독일</label>
        <input type="date" id="modalDate" />
      </div>

      <!-- 4. 비고 -->
      <div class="form-group">
        <label>비고 (감상평 / 메모)</label>
        <textarea id="modalNote" rows="3" placeholder="기억에 남는 문장이나 감상을 남겨보세요."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-delete" id="modalDeleteBtn" onclick="handleDelete()">삭제</button>
        <button class="btn btn-cancel" onclick="closeModal()">닫기</button>
        <button class="btn btn-save" onclick="handleSave()">저장</button>
      </div>
    </div>
  </div>

  <script>
    // 기본 샘플 데이터
    const initialSample = [
      { id: '1', title: '총, 균, 쇠', author: '재레드 다이아몬드', page: 752, date: '2026-08-01', note: '인류 문명의 불평등 기원을 밝힌 명저' }
    ];

    let books = JSON.parse(localStorage.getItem('my_reading_list')) || initialSample;
    let chart = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderTable();
      initChart();
      updateChart();
    });

    // 1. Google Books API 직접 Fetch 시도 (표준)
    async function searchViaDirectFetch(query) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 2500);
        const url = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=6`;
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) return null;
        const data = await res.json();
        return parseGoogleItems(data.items);
      } catch (e) {
        return null;
      }
    }

    // 2. AllOrigins CORS 프록시 경유 Fetch 시도 (IP/도메인 쿼터 차단 완벽 우회)
    async function searchViaAllOrigins(query) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3500);
        const targetUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=6`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) return null;
        const json = await res.json();
        const data = JSON.parse(json.contents);
        return parseGoogleItems(data.items);
      } catch (e) {
        return null;
      }
    }

    // 3. CorsProxy.io 프록시 경유 Fetch 시도 (2차 우회)
    async function searchViaCorsProxy(query) {
      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 3500);
        const targetUrl = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=6`;
        const proxyUrl = `https://corsproxy.io/?url=${encodeURIComponent(targetUrl)}`;
        const res = await fetch(proxyUrl, { signal: controller.signal });
        clearTimeout(timeout);
        if (!res.ok) return null;
        const data = await res.json();
        return parseGoogleItems(data.items);
      } catch (e) {
        return null;
      }
    }

    // Google API 응답 데이터 파싱 도우미
    function parseGoogleItems(items) {
      if (!items || items.length === 0) return null;
      return items.map(item => {
        const v = item.volumeInfo || {};
        return {
          title: v.title || '제목 없음',
          author: v.authors ? v.authors.join(', ') : '저자 미상',
          page: v.pageCount || 0,
          thumb: v.imageLinks?.smallThumbnail || v.imageLinks?.thumbnail || ''
        };
      });
    }

    // 문자열 공백/특수문자 제거 정규화 비교 함수
    function normalizeStr(str) {
      return (str || '').toLowerCase().replace(/[^a-zA-Z0-9가-힣]/g, '');
    }

    // [통합 검색 실행]
    async function executeSearch() {
      const inputEl = document.getElementById('searchInput');
      const query = inputEl.value.trim();
      const dropdown = document.getElementById('searchDropdown');
      if (!query) {
        openManualAddModal();
        return;
      }

      const normQuery = normalizeStr(query);

      // 1. 내 독서 목록에서 검색
      // 1-1) 제목이 정확히 일치하는 경우 -> 즉시 상세/수정 모달 오픈
      const exactMatch = books.find(b => normalizeStr(b.title) === normQuery);
      if (exactMatch) {
        dropdown.style.display = 'none';
        inputEl.value = '';
        openDetailModal(exactMatch.id);
        return;
      }

      // 1-2) 제목/저자 부분 일치 기존 기록 탐색
      const localMatches = books.filter(b => normalizeStr(b.title).includes(normQuery) || normalizeStr(b.author).includes(normQuery));

      dropdown.innerHTML = '<div style="padding: 14px; text-align: center; color: var(--text-sub);">도서 정보를 검색 중입니다...</div>';
      dropdown.style.display = 'block';

      // 2. 다중 프록시를 통한 외부 도서 DB 검색 (1차: 직접 -> 2차: AllOrigins -> 3차: CorsProxy)
      let externalResults = await searchViaDirectFetch(query);
      if (!externalResults || externalResults.length === 0) {
        externalResults = await searchViaAllOrigins(query);
      }
      if (!externalResults || externalResults.length === 0) {
        externalResults = await searchViaCorsProxy(query);
      }
      if (!externalResults) externalResults = [];

      dropdown.innerHTML = '';

      // 2-1) 내 목록에 일치 항목이 있다면 상단 분리 노출
      if (localMatches.length > 0) {
        const localHeader = document.createElement('div');
        localHeader.className = 'search-section-label';
        localHeader.textContent = '📚 내 독서 기록 목록에서 발견';
        dropdown.appendChild(localHeader);

        localMatches.forEach(book => {
          const itemEl = document.createElement('div');
          itemEl.className = 'search-item';
          itemEl.innerHTML = `
            <div style="width:34px;text-align:center;font-size:1.15rem;">📖</div>
            <div class="search-info">
              <div class="search-info-title">${escapeHtml(book.title)} <span style="font-size:0.75rem;color:var(--primary);font-weight:normal;">[기존기록]</span></div>
              <div class="search-info-sub">${escapeHtml(book.author || '저자 미상')} · ${book.page > 0 ? book.page + 'p' : '페이지 미상'}</div>
            </div>
          `;
          itemEl.onclick = () => {
            dropdown.style.display = 'none';
            inputEl.value = '';
            openDetailModal(book.id);
          };
          dropdown.appendChild(itemEl);
        });
      }

      // 2-2) 온라인 검색 결과 노출
      if (externalResults.length > 0) {
        if (localMatches.length > 0) {
          const extHeader = document.createElement('div');
          extHeader.className = 'search-section-label';
          extHeader.textContent = '🌐 온라인 도서 검색 결과 (신규 등록)';
          dropdown.appendChild(extHeader);
        }

        externalResults.forEach(item => {
          const itemEl = document.createElement('div');
          itemEl.className = 'search-item';
          itemEl.innerHTML = `
            ${item.thumb ? `<img class="search-thumb" src="${item.thumb}" alt="표지" />` : '<div class="search-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8;">NO IMG</div>'}
            <div class="search-info">
              <div class="search-info-title">${escapeHtml(item.title)}</div>
              <div class="search-info-sub">${escapeHtml(item.author)} · ${item.page > 0 ? item.page + 'p' : '페이지 미상'}</div>
            </div>
          `;
          itemEl.onclick = () => {
            dropdown.style.display = 'none';
            inputEl.value = '';
            openNewBookModalFromSearch(item);
          };
          dropdown.appendChild(itemEl);
        });
      }

      // 2-3) 검색 결과가 전혀 없는 경우
      if (localMatches.length === 0 && externalResults.length === 0) {
        dropdown.innerHTML = `
          <div class="search-empty-box">
            <div class="search-empty-msg">일치하는 검색 결과가 없습니다.<br>입력한 제목으로 바로 등록하시겠습니까?</div>
            <button class="btn-manual-from-search" onclick="openManualAddModal('${escapeHtml(query)}')">
              '${escapeHtml(query)}' 직접 상세 입력하기
            </button>
          </div>
        `;
        return;
      }

      // 목록 최하단에 직접 입력 버튼 항시 노출
      const manualOption = document.createElement('div');
      manualOption.className = 'search-item';
      manualOption.style.background = '#f8fafc';
      manualOption.innerHTML = `
        <div style="width:34px;text-align:center;font-size:1.2rem;">✍️</div>
        <div class="search-info">
          <div class="search-info-title" style="color:var(--primary); font-size:0.85rem;">원하는 결과가 없나요? 직접 입력하기</div>
        </div>
      `;
      manualOption.onclick = () => {
        dropdown.style.display = 'none';
        openManualAddModal(query);
      };
      dropdown.appendChild(manualOption);
    }

    // 온라인 검색 결과 선택 시 -> 저자, 페이지 수 자동 기입된 상세 모달 오픈
    function openNewBookModalFromSearch(data) {
      const today = new Date().toISOString().split('T')[0];

      document.getElementById('modalHeaderTitle').textContent = '새 도서 등록';
      document.getElementById('modalBookId').value = ''; 
      document.getElementById('modalTitle').value = data.title || '';
      document.getElementById('modalAuthor').value = data.author || '';
      document.getElementById('modalPage').value = data.page > 0 ? data.page : '';
      document.getElementById('modalDate').value = today;
      document.getElementById('modalNote').value = '';
      document.getElementById('modalDeleteBtn').style.display = 'none';

      document.getElementById('editModal').classList.add('active');
    }

    // 직접 입력 모달 열기
    function openManualAddModal(prefilledTitle = '') {
      const dropdown = document.getElementById('searchDropdown');
      dropdown.style.display = 'none';

      const inputVal = prefilledTitle || document.getElementById('searchInput').value.trim();
      const today = new Date().toISOString().split('T')[0];

      document.getElementById('modalHeaderTitle').textContent = '새 도서 직접 등록';
      document.getElementById('modalBookId').value = '';
      document.getElementById('modalTitle').value = inputVal;
      document.getElementById('modalAuthor').value = '';
      document.getElementById('modalPage').value = '';
      document.getElementById('modalDate').value = today;
      document.getElementById('modalNote').value = '';
      document.getElementById('modalDeleteBtn').style.display = 'none';

      document.getElementById('editModal').classList.add('active');
    }

    // 데이터 저장
    function saveData() {
      localStorage.setItem('my_reading_list', JSON.stringify(books));
      renderTable();
      updateChart();
    }

    // 테이블 렌더링
    function renderTable() {
      const tbody = document.getElementById('bookTableBody');
      const badge = document.getElementById('totalBadge');
      tbody.innerHTML = '';
      badge.textContent = `총 누적 ${books.length}권`;

      if (books.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="3" class="empty-state">
              등록된 도서가 없습니다.<br>도서를 검색하거나 직접 등록해보세요!
            </td>
          </tr>
        `;
        return;
      }

      books.forEach((book, idx) => {
        const tr = document.createElement('tr');
        const noteText = book.note ? escapeHtml(book.note) : '-';
        
        tr.innerHTML = `
          <td class="col-num">${idx + 1}</td>
          <td class="col-title" onclick="openDetailModal('${book.id}')">
            <span class="book-title-cell">${escapeHtml(book.title)}</span>
          </td>
          <td class="col-note" onclick="openDetailModal('${book.id}')" style="cursor:pointer;">
            <span class="note-preview">${noteText}</span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 기존 도서 상세 보기 & 수정 모달
    function openDetailModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;

      document.getElementById('modalHeaderTitle').textContent = '도서 상세 및 수정';
      document.getElementById('modalBookId').value = book.id;
      document.getElementById('modalTitle').value = book.title;
      document.getElementById('modalAuthor').value = book.author || '';
      document.getElementById('modalPage').value = book.page || '';
      document.getElementById('modalDate').value = book.date || '';
      document.getElementById('modalNote').value = book.note || '';
      document.getElementById('modalDeleteBtn').style.display = 'block';

      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    function handleSave() {
      const id = document.getElementById('modalBookId').value;
      const title = document.getElementById('modalTitle').value.trim();
      if (!title) {
        alert('책 제목을 입력해주세요.');
        return;
      }

      const author = document.getElementById('modalAuthor').value.trim();
      const page = parseInt(document.getElementById('modalPage').value, 10) || 0;
      const date = document.getElementById('modalDate').value;
      const note = document.getElementById('modalNote').value.trim();

      if (!id) {
        // 신규 등록
        const newBook = {
          id: Date.now().toString(),
          title: title,
          author: author,
          page: page,
          date: date || new Date().toISOString().split('T')[0],
          note: note
        };
        books.push(newBook);
        document.getElementById('searchInput').value = '';
      } else {
        // 기존 수정
        const idx = books.findIndex(b => b.id === id);
        if (idx !== -1) {
          books[idx].title = title;
          books[idx].author = author;
          books[idx].page = page;
          books[idx].date = date;
          books[idx].note = note;
        }
      }

      saveData();
      closeModal();
    }

    function handleDelete() {
      const id = document.getElementById('modalBookId').value;
      if (confirm('이 도서 기록을 삭제하시겠습니까?')) {
        books = books.filter(b => b.id !== id);
        saveData();
        closeModal();
      }
    }

    // 통계 차트
    function initChart() {
      const ctx = document.getElementById('readingChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{
            label: '월별 독서량(권)',
            data: [],
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.08)',
            borderWidth: 2.5,
            fill: true,
            tension: 0.35,
            pointBackgroundColor: '#2563eb',
            pointRadius: 4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { stepSize: 1, precision: 0 },
              grid: { color: '#f1f5f9' }
            },
            x: {
              grid: { display: false }
            }
          }
        }
      });
    }

    function updateChart() {
      if (!chart) return;

      const now = new Date();
      const labels = [];
      const dataPoints = [];

      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const yyyyMm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        labels.push(`${d.getMonth() + 1}월`);

        const count = books.filter(b => b.date && b.date.startsWith(yyyyMm)).length;
        dataPoints.push(count);
      }

      chart.data.labels = labels;
      chart.data.datasets[0].data = dataPoints;
      chart.update();
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/[&<>"']/g, function(m) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
      });
    }

    // 바깥 클릭 시 드롭다운 닫기
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper')) {
        document.getElementById('searchDropdown').style.display = 'none';
      }
    });
  </script>
</body>
</html>

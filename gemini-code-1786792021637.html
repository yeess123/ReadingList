<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>스마트 독서 리스트 앱</title>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-hover: #1d4ed8;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --radius: 14px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", Roboto, "Noto Sans KR", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px 12px 40px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 18px 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-count {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-light);
      padding: 4px 8px;
      border-radius: 20px;
    }

    .btn-sync-setting {
      background: none;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      color: var(--text-sub);
    }

    .chart-box {
      width: 100%;
      height: 170px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-color);
      font-size: 0.9rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn-search {
      padding: 10px 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-direct-add {
      padding: 10px 10px;
      background: #f8fafc;
      color: var(--text-sub);
      border: 1.5px solid var(--border-color);
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .search-dropdown {
      position: absolute;
      top: 48px;
      left: 0;
      right: 0;
      background: #fff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      display: none;
    }

    .search-section-label {
      padding: 6px 12px;
      background-color: #f8fafc;
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-sub);
      border-bottom: 1px solid var(--border-color);
    }

    .search-item {
      padding: 11px 12px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
      cursor: pointer;
    }

    .search-item:last-child {
      border-bottom: none;
    }

    .search-item:hover {
      background-color: #f8fafc;
    }

    .search-thumb {
      width: 34px;
      height: 48px;
      object-fit: cover;
      border-radius: 4px;
      background-color: #e2e8f0;
      flex-shrink: 0;
    }

    .search-info {
      flex: 1;
      min-width: 0;
    }

    .search-info-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-info-sub {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .table-container {
      width: 100%;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      table-layout: fixed;
    }

    th {
      background-color: #f8fafc;
      color: var(--text-sub);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 9px 8px;
      border-bottom: 1px solid var(--border-color);
      text-align: left;
    }

    td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
      font-size: 0.82rem;
    }

    .col-num { width: 28px; text-align: center; color: #94a3b8; font-size: 0.76rem; }
    .col-title { width: 38%; font-weight: 600; cursor: pointer; }
    .col-note { width: auto; color: var(--text-sub); font-size: 0.8rem; }

    .book-title-cell {
      cursor: pointer;
      color: var(--text-main);
      font-weight: 600;
      word-break: break-word;
      line-height: 1.35;
    }

    .book-title-cell:hover {
      color: var(--primary);
      text-decoration: underline;
    }

    .note-preview {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
      color: #475569;
    }

    .empty-state {
      text-align: center;
      padding: 32px 12px;
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* 모달 공통 */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(2px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 200;
      padding: 16px;
      visibility: hidden;
      opacity: 0;
      transition: all 0.2s ease-in-out;
    }

    .modal-overlay.active {
      visibility: visible;
      opacity: 1;
    }

    .modal-content {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      gap: 13px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-row-author-page {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .form-row-author-page .group-author { flex: 1; min-width: 0; }
    .form-row-author-page .group-page { width: 82px; flex-shrink: 0; }

    .page-input-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .page-input-box input {
      width: 100%;
      padding: 9px 24px 9px 8px !important;
      font-size: 0.84rem !important;
      text-align: right;
    }

    .page-unit {
      position: absolute;
      right: 7px;
      font-size: 0.78rem;
      color: var(--text-sub);
      pointer-events: none;
    }

    .form-group input, .form-group textarea {
      padding: 9px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 6px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
    }

    .btn-save { background: var(--primary); color: white; }
    .btn-cancel { background: #e2e8f0; color: #475569; }
    .btn-delete { background: #fee2e2; color: #dc2626; margin-right: auto; }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 상단 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">📖 독서 생활</div>
        <div class="header-actions">
          <button class="btn-sync-setting" onclick="openSyncModal()">⚙️ GitHub 동기화</button>
          <div class="badge-count" id="totalBadge">총 0권</div>
        </div>
      </div>
      <div class="chart-box">
        <canvas id="readingChart"></canvas>
      </div>
    </div>

    <!-- 검색 카드 -->
    <div class="card">
      <div class="search-wrapper">
        <input type="text" id="searchInput" class="search-input" placeholder="책 제목 또는 키워드 입력..." onkeypress="if(event.key==='Enter') executeSearch();" />
        <button class="btn-search" onclick="executeSearch()">검색</button>
        <button class="btn-direct-add" onclick="openManualAddModal()">+ 직접입력</button>
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>

    <!-- 목록 카드 -->
    <div class="card">
      <div class="card-header">
        <div class="card-title">독서 기록 목록</div>
      </div>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th class="col-num"></th>
              <th class="col-title">제목</th>
              <th class="col-note">비고</th>
            </tr>
          </thead>
          <tbody id="bookTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 상세 정보 모달 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal-content">
      <div class="modal-title" id="modalHeaderTitle">도서 상세 및 수정</div>
      <input type="hidden" id="modalBookId" />

      <div class="form-group">
        <label>책 제목 *</label>
        <input type="text" id="modalTitle" placeholder="책 제목을 입력하세요" />
      </div>

      <div class="form-row-author-page">
        <div class="form-group group-author">
          <label>저자</label>
          <input type="text" id="modalAuthor" placeholder="저자 이름" />
        </div>
        <div class="form-group group-page">
          <label>페이지</label>
          <div class="page-input-box">
            <input type="number" id="modalPage" placeholder="350" />
            <span class="page-unit">p</span>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>완독일</label>
        <input type="date" id="modalDate" />
      </div>

      <div class="form-group">
        <label>비고 (감상평 / 메모)</label>
        <textarea id="modalNote" rows="3" placeholder="기억에 남는 문장이나 감상을 남겨보세요."></textarea>
      </div>

      <div class="modal-actions">
        <button class="btn btn-delete" id="modalDeleteBtn" onclick="handleDelete()">삭제</button>
        <button class="btn btn-cancel" onclick="closeModal()">닫기</button>
        <button class="btn btn-save" onclick="handleSave()">저장</button>
      </div>
    </div>
  </div>

  <!-- GitHub 동기화 설정 모달 -->
  <div class="modal-overlay" id="syncModal">
    <div class="modal-content">
      <div class="modal-title">GitHub 저장소 동기화 설정</div>
      <p style="font-size:0.8rem; color:var(--text-sub); line-height:1.4;">
        설정해 두시면 PC와 스마트폰에서 기록한 내용이 GitHub 저장소의 <code>books.json</code> 파일로 자동 동기화됩니다.
      </p>

      <div class="form-group">
        <label>GitHub 아이디 (Username)</label>
        <input type="text" id="ghOwner" placeholder="예: your-github-id" />
      </div>
      <div class="form-group">
        <label>저장소 이름 (Repo Name)</label>
        <input type="text" id="ghRepo" placeholder="예: reading-list" />
      </div>
      <div class="form-group">
        <label>Personal Access Token</label>
        <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" />
      </div>

      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="closeSyncModal()">닫기</button>
        <button class="btn btn-save" onclick="saveSyncSettings()">저장 및 동기화</button>
      </div>
    </div>
  </div>

  <script>
    let books = JSON.parse(localStorage.getItem('my_reading_list')) || [
      { id: '1', title: '총, 균, 쇠', author: '재레드 다이아몬드', page: 752, date: '2026-08-01', note: '인류 문명의 불평등 기원을 밝힌 명저' }
    ];
    let chart = null;
    let ghFileSha = null;

    window.addEventListener('DOMContentLoaded', async () => {
      renderTable();
      initChart();
      updateChart();
      await loadFromGitHub(); // 시작 시 GitHub에서 최신 데이터 가져오기
    });

    /* --- GitHub 연동 핵심 로직 --- */
    function getGhConfig() {
      return {
        owner: localStorage.getItem('gh_owner') || '',
        repo: localStorage.getItem('gh_repo') || '',
        token: localStorage.getItem('gh_token') || ''
      };
    }

    function openSyncModal() {
      const cfg = getGhConfig();
      document.getElementById('ghOwner').value = cfg.owner;
      document.getElementById('ghRepo').value = cfg.repo;
      document.getElementById('ghToken').value = cfg.token;
      document.getElementById('syncModal').classList.add('active');
    }

    function closeSyncModal() {
      document.getElementById('syncModal').classList.remove('active');
    }

    async function saveSyncSettings() {
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      localStorage.setItem('gh_owner', owner);
      localStorage.setItem('gh_repo', repo);
      localStorage.setItem('gh_token', token);

      closeSyncModal();
      alert('설정이 저장되었습니다. GitHub와 동기화를 시도합니다.');
      await loadFromGitHub();
    }

    // GitHub에서 books.json 불러오기
    async function loadFromGitHub() {
      const { owner, repo, token } = getGhConfig();
      if (!owner || !repo || !token) return;

      try {
        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/books.json`, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });

        if (res.ok) {
          const data = await res.json();
          ghFileSha = data.sha;
          // UTF-8 디코딩
          const content = decodeURIComponent(escape(atob(data.content)));
          books = JSON.parse(content);
          localStorage.setItem('my_reading_list', JSON.stringify(books));
          renderTable();
          updateChart();
        } else if (res.status === 404) {
          // 파일이 아직 없으면 새로 생성 저장
          await syncToGitHub();
        }
      } catch (e) {
        console.error('GitHub 로드 실패:', e);
      }
    }

    // GitHub의 books.json 파일로 저장하기
    async function syncToGitHub() {
      const { owner, repo, token } = getGhConfig();
      if (!owner || !repo || !token) return;

      try {
        const contentStr = JSON.stringify(books, null, 2);
        // UTF-8 인코딩 후 base64 변환
        const contentB64 = btoa(unescape(encodeURIComponent(contentStr)));

        const bodyData = {
          message: 'Update reading list via Web App',
          content: contentB64
        };
        if (ghFileSha) bodyData.sha = ghFileSha;

        const res = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/books.json`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
            'Accept': 'application/vnd.github.v3+json'
          },
          body: JSON.stringify(bodyData)
        });

        if (res.ok) {
          const resData = await res.json();
          ghFileSha = resData.content.sha;
        }
      } catch (e) {
        console.error('GitHub 저장 실패:', e);
      }
    }

    /* --- 도서 검색 (프록시 기반) --- */
    async function executeSearch() {
      const inputEl = document.getElementById('searchInput');
      const query = inputEl.value.trim();
      const dropdown = document.getElementById('searchDropdown');
      if (!query) {
        openManualAddModal();
        return;
      }

      dropdown.innerHTML = '<div style="padding: 14px; text-align: center; color: var(--text-sub);">도서 검색 중...</div>';
      dropdown.style.display = 'block';

      let items = null;
      try {
        const target = `https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=6`;
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(target)}`);
        const json = await res.json();
        const data = JSON.parse(json.contents);
        if (data.items) {
          items = data.items.map(it => {
            const v = it.volumeInfo || {};
            return {
              title: v.title || '제목 없음',
              author: v.authors ? v.authors.join(', ') : '저자 미상',
              page: v.pageCount || 0,
              thumb: v.imageLinks?.smallThumbnail || v.imageLinks?.thumbnail || ''
            };
          });
        }
      } catch (e) {}

      dropdown.innerHTML = '';
      if (!items || items.length === 0) {
        dropdown.innerHTML = `<div style="padding:14px; text-align:center; color:var(--text-sub); font-size:0.85rem;">검색 결과가 없습니다.<br><button class="btn-manual-from-search" style="margin-top:8px;" onclick="openManualAddModal('${escapeHtml(query)}')">직접 입력하기</button></div>`;
        return;
      }

      items.forEach(it => {
        const el = document.createElement('div');
        el.className = 'search-item';
        el.innerHTML = `
          ${it.thumb ? `<img class="search-thumb" src="${it.thumb}" alt="표지" />` : '<div class="search-thumb" style="display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8;">NO IMG</div>'}
          <div class="search-info">
            <div class="search-info-title">${escapeHtml(it.title)}</div>
            <div class="search-info-sub">${escapeHtml(it.author)} · ${it.page > 0 ? it.page + 'p' : '페이지 미상'}</div>
          </div>
        `;
        el.onclick = () => {
          dropdown.style.display = 'none';
          inputEl.value = '';
          openNewBookModal(it);
        };
        dropdown.appendChild(el);
      });
    }

    function openNewBookModal(data) {
      document.getElementById('modalHeaderTitle').textContent = '새 도서 등록';
      document.getElementById('modalBookId').value = '';
      document.getElementById('modalTitle').value = data.title || '';
      document.getElementById('modalAuthor').value = data.author || '';
      document.getElementById('modalPage').value = data.page > 0 ? data.page : '';
      document.getElementById('modalDate').value = new Date().toISOString().split('T')[0];
      document.getElementById('modalNote').value = '';
      document.getElementById('modalDeleteBtn').style.display = 'none';
      document.getElementById('editModal').classList.add('active');
    }

    function openManualAddModal(title = '') {
      document.getElementById('searchDropdown').style.display = 'none';
      openNewBookModal({ title: title || document.getElementById('searchInput').value.trim() });
    }

    function openDetailModal(id) {
      const book = books.find(b => b.id === id);
      if (!book) return;
      document.getElementById('modalHeaderTitle').textContent = '도서 상세 및 수정';
      document.getElementById('modalBookId').value = book.id;
      document.getElementById('modalTitle').value = book.title;
      document.getElementById('modalAuthor').value = book.author || '';
      document.getElementById('modalPage').value = book.page || '';
      document.getElementById('modalDate').value = book.date || '';
      document.getElementById('modalNote').value = book.note || '';
      document.getElementById('modalDeleteBtn').style.display = 'block';
      document.getElementById('editModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('editModal').classList.remove('active');
    }

    async function handleSave() {
      const id = document.getElementById('modalBookId').value;
      const title = document.getElementById('modalTitle').value.trim();
      if (!title) { alert('책 제목을 입력해주세요.'); return; }

      const author = document.getElementById('modalAuthor').value.trim();
      const page = parseInt(document.getElementById('modalPage').value, 10) || 0;
      const date = document.getElementById('modalDate').value;
      const note = document.getElementById('modalNote').value.trim();

      if (!id) {
        books.push({ id: Date.now().toString(), title, author, page, date, note });
      } else {
        const idx = books.findIndex(b => b.id === id);
        if (idx !== -1) books[idx] = { ...books[idx], title, author, page, date, note };
      }

      saveLocalAndSync();
      closeModal();
    }

    async function handleDelete() {
      const id = document.getElementById('modalBookId').value;
      if (confirm('정말 삭제하시겠습니까?')) {
        books = books.filter(b => b.id !== id);
        saveLocalAndSync();
        closeModal();
      }
    }

    function saveLocalAndSync() {
      localStorage.setItem('my_reading_list', JSON.stringify(books));
      renderTable();
      updateChart();
      syncToGitHub(); // GitHub 저장소에 자동 커밋
    }

    function renderTable() {
      const tbody = document.getElementById('bookTableBody');
      tbody.innerHTML = '';
      document.getElementById('totalBadge').textContent = `총 ${books.length}권`;

      if (books.length === 0) {
        tbody.innerHTML = '<tr><td colspan="3" class="empty-state">등록된 도서가 없습니다.</td></tr>';
        return;
      }

      books.forEach((b, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-num">${idx + 1}</td>
          <td class="col-title" onclick="openDetailModal('${b.id}')"><span class="book-title-cell">${escapeHtml(b.title)}</span></td>
          <td class="col-note" onclick="openDetailModal('${b.id}')"><span class="note-preview">${escapeHtml(b.note || '-')}</span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    function initChart() {
      const ctx = document.getElementById('readingChart').getContext('2d');
      chart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [{ label: '권수', data: [], borderColor: '#2563eb', backgroundColor: 'rgba(37, 99, 235, 0.08)', borderWidth: 2.5, fill: true, tension: 0.35, pointRadius: 4 }] },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } }, x: { grid: { display: false } } } }
      });
    }

    function updateChart() {
      if (!chart) return;
      const now = new Date();
      const labels = [], data = [];
      for (let i = 5; i >= 0; i--) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const yyyyMm = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
        labels.push(`${d.getMonth() + 1}월`);
        data.push(books.filter(b => b.date && b.date.startsWith(yyyyMm)).length);
      }
      chart.data.labels = labels;
      chart.data.datasets[0].data = data;
      chart.update();
    }

    function escapeHtml(str) {
      return (str || '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' })[m]);
    }

    document.addEventListener('click', e => {
      if (!e.target.closest('.search-wrapper')) document.getElementById('searchDropdown').style.display = 'none';
    });
  </script>
</body>
</html>
